async function del(id) {
  const e = MINE.find(x => x.id === id);
  if (!e) return;
  if (!await ask("Delete this property?", `<b>${esc(e.title)}</b> will be removed permanently.`, "Delete property", "d")) return;
  try {
    const { error } = await sb.from("events").delete().eq("id", id);
    if (error) return toast(error.message);
    toast("Property deleted");
    await loadAll();
    rOrg();
    rHome();
  } catch (e) { console.error("del error:", e); toast("Could not delete property"); }
}

function openEditor(id) {
  needAuth(async () => {
    if (!isOrg()) return toast("Only host accounts can list properties");
    const e = id ? MINE.find(x => x.id === id) : null;
    if (id && !e) return toast("Property not found");

    const D = e
      ? { title: e.title, category: e.category, city: e.city, venue: e.venue, date: e.date, time: e.time,
          desc: e.description || "", tagline: e.tagline || "", featured: !!e.featured,
          featuredStatus: e.featured_status || (e.featured ? "approved" : "none") }
      : { title: "", category: "", city: "", venue: "", date: "", time: "14:00",
          desc: "", tagline: "", featured: false, featuredStatus: "none" };

    const T = e ? e.tiers.map(t => ({ ...t })) : [{ name: "Standard Room", price: "", qty: "", sold: 0 }];
    const PR = e ? (e.presenters || []).map(x => ({ ...x })) : [];
    let img = e ? e.img || "" : "";
    const m = sheet(""), g = s => m.querySelector(s);

    const draw = () => {
      const featHint =
        D.featuredStatus === "approved" ? "✓ Approved — your property is featured on Explore." :
        D.featuredStatus === "pending"  ? "⏳ Awaiting admin approval." :
        D.featuredStatus === "rejected" ? "✗ Request was declined. Tick to request again." :
        "Featured properties appear in the carousel at the top of Explore.";

      g(".sh").innerHTML = `<div class="grab"></div>` + sh(e ? "Edit property" : "List a property") + `
        <div class="fld"><label>Property name</label><input class="in" data-k="title" value="${esc(D.title)}" placeholder="e.g. Zambezi River Lodge"></div>
        <div class="two">
          <div class="fld"><label>Property type</label><select class="in" data-k="category"><option value="">Select</option>${CATS.map(c => `<option ${c === D.category ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div>
          <div class="fld"><label>City</label><input class="in" data-k="city" list="citylist" value="${esc(D.city)}" placeholder="Livingstone"><datalist id="citylist">${CITIES.map(c => `<option>${c}</option>`).join("")}</datalist></div>
        </div>
        <div class="fld"><label>Address / area</label><input class="in" data-k="venue" value="${esc(D.venue)}" placeholder="e.g. Mosi-oa-Tunya Road, Livingstone"></div>
        <div class="two">
          <div class="fld"><label>Available from</label><input class="in" type="date" data-k="date" value="${D.date}" ${e ? "" : `min="${today()}"`}></div>
          <div class="fld"><label>Check-in time</label><input class="in" type="time" data-k="time" value="${D.time}"></div>
        </div>
        <p class="hint" style="margin:-6px 0 12px">Check-out is fixed at ${CHECKOUT_HOUR}:00 AM the morning after check-in.</p>
        <div class="fld"><label>Short summary (shown under About)</label><input class="in" data-k="tagline" value="${esc(D.tagline)}" placeholder="One line that sells the stay"></div>
        <div class="fld"><label>Full description</label><textarea class="in" data-k="desc" placeholder="Tell guests what to expect">${esc(D.desc)}</textarea></div>
        <div class="fld"><label>Cover photo</label><div class="upload"><input type="file" accept="image/*" id="fi">${img ? `<img src="${img}" alt="" loading="lazy">` : `<div>${I("img")}<br>Tap to upload a cover photo</div>`}</div></div>
        <h2 class="h2" style="margin-top:8px">Gallery</h2>
        <p class="sub">Photos of the property — the pool, the rooms, the restaurant. Add a caption and a short description for each.</p>
        ${PR.map((x, i) => `<div class="pr">
          <label class="pth"><input type="file" accept="image/*" data-pi="${i}">${x.img ? `<img src="${x.img}" alt="">` : I("img")}</label>
          <div class="pf"><input class="in" data-p="${i}" data-f="name" placeholder="Caption (e.g. Infinity Pool)" value="${esc(x.name)}"><input class="in" data-p="${i}" data-f="role" placeholder="Short description" value="${esc(x.role || "")}"></div>
          <button class="btn d sm" data-pr="${i}" aria-label="Remove gallery photo">${I("trash")}</button></div>`).join("")}
        <button class="btn s b" id="ap" style="margin-bottom:8px">${I("plus")}Add gallery photo</button>

        <div class="fld" style="margin-top:12px">
          <label>Explore tab featuring</label>
          <label class="chk">
            <input type="checkbox" id="featreq"
              ${D.featuredStatus === "pending" || D.featuredStatus === "approved" ? "checked" : ""}
              ${D.featuredStatus === "approved" ? "disabled" : ""}>
            Request to be featured on Explore
          </label>
          <p class="hint">${featHint}</p>
        </div>

        <h2 class="h2" style="margin-top:8px">Rooms</h2>
        <p class="sub">Price is per room, per night. Use 0 for free rooms. A ${fee}% platform fee applies.</p>
        ${T.map((t, i) => `<div class="trow">
          <input class="in n" data-t="${i}" data-f="name" placeholder="Room type" value="${esc(t.name)}">
          <input class="in p" type="number" inputmode="numeric" min="0" data-t="${i}" data-f="price" placeholder="Per night" value="${t.price}">
          <input class="in q" type="number" inputmode="numeric" min="1" data-t="${i}" data-f="qty" placeholder="Rooms" value="${t.qty}">
          <button class="btn d sm" data-rm="${i}" ${T.length === 1 || t.sold > 0 ? "disabled" : ""} aria-label="Remove room type">${I("trash")}</button></div>`).join("")}
        <button class="btn s b" id="at" style="margin-bottom:14px">${I("plus")}Add room type</button>
        <button class="btn b" id="sv">${e ? "Save changes" : "Publish property"}</button>`;

      m.querySelectorAll("[data-k]").forEach(i => {
        const h = () => D[i.dataset.k] = i.type === "checkbox" ? i.checked : i.value;
        i.oninput = h;
        i.onchange = h;
      });
      m.querySelectorAll("[data-t]").forEach(i => i.oninput = () => T[i.dataset.t][i.dataset.f] = i.value);
      m.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { T.splice(+b.dataset.rm, 1); draw() });
      g("#at").onclick = () => { T.push({ name: "", price: "", qty: "", sold: 0 }); draw() };
      m.querySelectorAll("[data-p]").forEach(i => i.oninput = () => PR[i.dataset.p][i.dataset.f] = i.value);
      m.querySelectorAll("[data-pr]").forEach(b => b.onclick = () => { PR.splice(+b.dataset.pr, 1); draw() });
      m.querySelectorAll("[data-pi]").forEach(i => i.onchange = () => shrink(i.files[0], 400, u => { PR[i.dataset.pi].img = u; draw() }));
      g("#ap").onclick = () => { PR.push({ name: "", role: "", img: "" }); draw() };
      g("#fi").onchange = pick;
      g("#sv").onclick = save;
    };

    function pick(ev) {
      const f = ev.target.files[0];
      if (!f) return;
      if (!f.type.startsWith("image/")) return toast("Choose an image file");
      shrink(f, 900, u => { img = u; draw() });
    }

    async function save() {
      for (const k of ["title", "category", "city", "venue", "date", "time"])
        if (!String(D[k]).trim()) return toast("Please fill in all property details");
      if (!e && D.date < today()) return toast("Pick an availability date of today or later");
      for (const t of T) {
        if (!String(t.name).trim()) return toast("Every room type needs a name");
        if (t.price === "" || +t.price < 0) return toast("Enter a valid nightly price");
        if (t.qty === "" || +t.qty < 1) return toast("Enter a room count");
        if (+t.qty < (t.sold || 0)) return toast(`"${t.name}" already has ${t.sold} booked`);
      }
      const btn = g("#sv");
      btn.disabled = true;

      const wantsFeatured = !!(m.querySelector("#featreq") && m.querySelector("#featreq").checked);
      const prevStatus = D.featuredStatus;
      let featuredStatus = prevStatus;
      let featured = !!D.featured;

      if (prevStatus === "approved") {
        featured = true;
        featuredStatus = "approved";
      } else if (wantsFeatured) {
        featured = false;
        featuredStatus = "pending";
      } else {
        featured = false;
        featuredStatus = "none";
      }

      const requestedAt = (featuredStatus === "pending" && prevStatus !== "pending")
        ? new Date().toISOString()
        : (e && e.featured_requested_at) || null;

      try {
        const ev = {
          id: e ? e.id : uid("ev_"),
          owner: me.id,
          owner_name: me.name,
          title: D.title.trim(),
          category: D.category,
          city: D.city.trim(),
          venue: D.venue.trim(),
          date: D.date,
          time: D.time,
          description: D.desc.trim(),
          img,
          tiers: T.map(t => ({ name: t.name.trim(), price: +t.price || 0, qty: +t.qty, sold: t.sold || 0 })),
          featured,
          featured_status: featuredStatus,
          featured_requested_at: requestedAt,
          tagline: D.tagline.trim(),
          presenters: PR.filter(x => String(x.name).trim() || x.img).map(x => ({ name: x.name.trim(), role: (x.role || "").trim(), img: x.img || "" })),
          status: "live"
        };
        const { error } = await (e ? sb.from("events").update(ev).eq("id", ev.id) : sb.from("events").insert(ev));
        if (error) { btn.disabled = false; return toast(error.message) }
        m.close();
        toast(e ? "Property updated" : "Property published");
        await loadAll();
        rOrg();
        rHome();
      } catch (err) {
        btn.disabled = false;
        console.error("save error:", err);
        toast("An error occurred");
      }
    }
    draw();
  });
}

/* ---------- PAYOUTS ---------- */
let PAYOUTS = [];
const PAY_LABEL = { requested: "Requested", verifying: "Verifying", approved: "Approved", paid: "Paid", rejected: "Declined" };

async function loadPayouts() {
  if (!me) { PAYOUTS = []; return; }
  try {
    const { data } = await sb.from("payouts").select("*")
      .eq("organiser_id", me.id).order("created_at", { ascending: false });
    PAYOUTS = data || [];
  } catch (e) {
    console.warn("loadPayouts error:", e);
    PAYOUTS = [];
  }
}

function payoutBalance() {
  const gross = MINE.reduce((s, e) => s + (e.tiers || []).reduce((a, t) => a + t.sold * t.price, 0), 0);
  const earned = Math.round(gross * (1 - fee / 100));
  const committed = PAYOUTS.filter(p => p.status !== "rejected")
    .reduce((s, p) => s + Number(p.amount || 0), 0);
  return Math.max(0, earned - committed);
}

function openPayoutRequest() {
  needAuth(() => {
    if (!isOrg()) return toast("Host accounts only");
    const bal = payoutBalance();
    if (bal <= 0) return toast("No funds available to pay out yet");

    const m = sheet(""), g = s => m.querySelector(s);
    let amt = bal, net = "MTN", ph = me.phone || "", nm = me.name || "";

    const draw = () => {
      g(".sh").innerHTML = `<div class="grab"></div>` +
        sh("Request payout", `Available to withdraw: <b style="color:var(--tx)">${money(bal)}</b>`) +
        `<div class="fld"><label>Amount (ZMW)</label>
           <input class="in" id="pa" type="number" inputmode="numeric" min="1" max="${bal}" value="${amt}"></div>
         <div class="fld"><label>Mobile money network</label>
           <div class="seg">${["MTN", "Airtel", "Zamtel"].map(p =>
             `<button data-n="${p}" class="${p === net ? "on" : ""}">${p}</button>`).join("")}</div></div>
         <div class="fld"><label>Mobile money number</label>
           <input class="in" id="pp" type="tel" value="${esc(ph)}" placeholder="0977 123 456" autocomplete="tel"></div>
         <div class="fld"><label>Account name</label>
           <input class="in" id="pn" value="${esc(nm)}" autocomplete="name"></div>
         <button class="btn b" id="psub">Submit payout request</button>
         <p class="hint c">Payouts are verified before they are sent.</p>`;

      g("#pa").oninput = e => { amt = e.target.value };
      g("#pp").oninput = e => { ph = e.target.value };
      g("#pn").oninput = e => { nm = e.target.value };
      m.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { net = b.dataset.n; draw() });
      g("#psub").onclick = submitPayout;
    };

    async function submitPayout() {
      const a = Math.floor(Number(amt));
      if (!a || a < 1) return toast("Enter an amount");
      if (a > bal) return toast("Amount is more than your available balance");
      if (!isValidPhone(ph)) return toast("Enter a valid mobile money number");
      if (nm.trim().length < 2) return toast("Enter the account name");

      const btn = g("#psub");
      btn.disabled = true;
      btn.innerHTML = '<span class="spin"></span>';

      try {
        const { error } = await sb.from("payouts").insert({
          id: uid("po_"),
          organiser_id: me.id,
          organiser_name: me.name || "",
          amount: a,
          network: net,
          phone: sanitizePhone(ph),
          account_name: nm.trim(),
          status: "requested"
        });
        if (error) throw error;
        m.close();
        await loadPayouts();
        rOrg();
        payoutConfirmed(a);
      } catch (err) {
        console.error("Payout request error:", err);
        btn.disabled = false;
        btn.textContent = "Submit payout request";
        toast(err && err.message ? err.message : "Could not submit payout request");
      }
    }

    draw();
  });
}

function payoutConfirmed(a) {
  sheet(`<div class="okicon">✓</div>` + sh("Payout requested") +
    `<p class="desc">Your payout of <b style="color:var(--tx)">${money(a)}</b> will be disbursed to you after verification and within 2 working days.</p>
     <button class="btn b" data-x style="margin-top:16px">Done</button>`);
}

/* ---------- END PAYOUTS ---------- */

/* ---------- ACCOUNT ---------- */
function rMe() {
  $("#ml").innerHTML = me
    ? `<div class="me"><div class="av">${esc((me.name || "U")[0].toUpperCase())}</div>
        <h2>${esc(me.name || "")}</h2>
        <p style="color:var(--t2);margin:6px 0 20px;font-size:.9rem">${esc(me.email || "")}${me.phone ? "<br>" + esc(me.phone) : ""}</p></div>
       <div class="grp">
         <div class="gi">${I("bed")}<span>Stays booked</span><span class="sp">${BOOKINGS.length}</span></div>
         ${isOrg() ? `<div class="gi">${I("home")}<span>Properties listed</span><span class="sp">${MINE.length}</span></div>` : ""}
         <div class="gi">${I("user")}<span>Account type</span><span class="sp">${me.role === "organiser" ? "Host" : me.role === "admin" ? "Admin" : "Guest"}</span></div>
         <div class="gi">${I("clock")}<span>Standard check-out</span><span class="sp">${CHECKOUT_HOUR}:00 AM</span></div>
       </div>
       ${isOrg() ? "" : `<p class="hint c">Want to list a property? Create a separate host account.</p>`}
       ${me.role === "admin" ? `<div id="adminFeat"></div>` : ""}
       <button class="btn d b" style="margin-top:20px" id="so">Sign out</button>`
    : `<div class="emp">${I("user")}<p>Sign in to book a stay and manage your properties.</p>
       <button class="btn" style="margin-top:16px" onclick="openAuth()">Sign in or create account</button></div>`;

  const b = $("#so");
  if (b) b.onclick = async () => {
    if (await ask("Sign out?", "You can sign back in any time.", "Sign out", "d")) {
      try { await sb.auth.signOut() } catch { }
      me = null;
      MINE = [];
      BOOKINGS = [];
      PAYOUTS = [];
      closeStay();
      go("home");
      toast("Signed out");
    }
  };

  if (me && me.role === "admin") loadAdminFeatured();
}

async function loadAdminFeatured() {
  const box = $("#adminFeat");
  if (!box) return;
  box.innerHTML = `<h2 class="h2">Feature requests</h2><div class="sk"><div class="sk-line"></div></div>`;
  let data = [];
  try {
    const { data: rows } = await sb
      .from("events")
      .select("*")
      .eq("featured_status", "pending")
      .order("created_at", { ascending: false });
    data = rows || [];
  } catch (e) { console.warn("loadAdminFeatured:", e); }

  if (!data.length) {
    box.innerHTML = `<h2 class="h2">Feature requests</h2><p class="hint c">No pending requests.</p>`;
    return;
  }
  box.innerHTML = `<h2 class="h2">Feature requests (${data.length})</h2>` +
    data.map(e => `
      <div class="ocard">
        <div class="top" onclick="closeStay();openStay('${esc(e.id)}')">
          <div class="th" style="width:64px;height:64px">${e.img ? `<img src="${e.img}" loading="lazy" alt="">` : I("bed")}</div>
          <div class="rb">
            <b>${esc(e.title)}</b>
            <span>${esc(e.category || "")} · ${esc(e.city || "")}</span>
            <span>by ${esc(e.owner_name || "Host")}</span>
          </div>
        </div>
        <div class="acts">
          <button class="btn sm" data-approve="${esc(e.id)}">✓ Approve</button>
          <button class="btn d sm" data-reject="${esc(e.id)}">✗ Decline</button>
        </div>
      </div>`).join("");

  box.querySelectorAll("[data-approve]").forEach(b => b.onclick = () => reviewFeatured(b.dataset.approve, "approved"));
  box.querySelectorAll("[data-reject]").forEach(b => b.onclick = () => reviewFeatured(b.dataset.reject, "rejected"));
}

async function reviewFeatured(id, status) {
  const updates = {
    featured: status === "approved",
    featured_status: status,
    featured_reviewed_at: new Date().toISOString(),
    featured_reviewed_by: me ? me.id : null
  };
  const { error } = await sb.from("events").update(updates).eq("id", id);
  if (error) return toast(error.message);
  toast(status === "approved" ? "Property approved for Explore" : "Request declined");
  await loadAll();
  loadAdminFeatured();
  if (tab === "home") rHome();
}

/* ---------- INIT ---------- */
loadSaved();
updateFbtn();
$("#list").innerHTML = `<div class="sk">${skeleton(5)}</div>`;
(async () => {
  try {
    await loadMe();
    await loadAll();
    go("home");
    openFromUrl();
    runAutoCheckout(true);
    sb.auth.onAuthStateChange(async (event) => {
      if (!["SIGNED_IN", "SIGNED_OUT", "TOKEN_REFRESHED", "USER_UPDATED"].includes(event)) return;
      try {
        await loadMe();
        await loadAll();
        drawTabs();
        if (tab === "home") rHome();
        else if (tab === "tix") rStays();
        else if (tab === "org") rOrg();
        else if (tab === "chk") rChk();
        else if (tab === "me") rMe();
      } catch (e) { console.error("Auth state change error:", e); }
    });
  } catch (e) {
    console.error("Init error:", e);
    toast("Failed to load app");
  }
})();

/* Auto check-out sweep — runs on load and then every minute while
   the app is open, so nobody stays checked in past 10:00 AM. */
setInterval(() => { runAutoCheckout(false); }, 60000);
</script>
</body>
</html>
